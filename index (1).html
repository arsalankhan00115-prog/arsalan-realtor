<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHANS ARSALAN | Ultra-Luxury Real Estate Agency</title>
  <meta name="description" content="Experience unprecedented luxury real estate with Khans Arsalan Estates. Featuring exclusive penthouses, modern waterfront villas, and architectural marvels.">

  <!-- UI/UX Pro Max CSS & Google Fonts -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Tailwind CSS CDN for utility alignment -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Framer Motion CDN -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Load Property Dataset -->
  <script src="js/data/properties.js"></script>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen">
  
  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Application JSX Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion || window.framerMotion || {
      motion: {
        div: 'div',
        button: 'button',
        section: 'section',
        h1: 'h1',
        h2: 'h2',
        p: 'p',
        span: 'span',
        img: 'img'
      },
      AnimatePresence: ({ children }) => children
    };

    // Main App Component
    function App() {
      const [activeCategory, setActiveCategory] = useState('all');
      const [bookmarkedIds, setBookmarkedIds] = useState(['prop-1']);
      const [selectedProperty, setSelectedProperty] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [priceRange, setPriceRange] = useState(60000000);
      const [activeHeroTab, setActiveHeroTab] = useState('buy');
      const [isScrolled, setIsScrolled] = useState(false);
      const [showToast, setShowToast] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      
      // Mortgage Calculator State
      const [calcPrice, setCalcPrice] = useState(15000000);
      const [calcDownPayment, setCalcDownPayment] = useState(20); // 20%
      const [calcInterest, setCalcInterest] = useState(6.5);
      const [calcTerm, setCalcTerm] = useState(30);

      // Handle Scroll Effect for Navbar
      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 40);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Trigger Icons render after mount
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 3000);
      };

      const toggleBookmark = (id, e) => {
        e.stopPropagation();
        if (bookmarkedIds.includes(id)) {
          setBookmarkedIds(bookmarkedIds.filter(bId => bId !== id));
          triggerToast('Property removed from saved portfolio');
        } else {
          setBookmarkedIds([...bookmarkedIds, id]);
          triggerToast('Property saved to your exclusive portfolio!');
        }
      };

      // Filtered Properties
      const filteredProperties = PROPERTY_DATA.filter(prop => {
        const matchesCategory = activeCategory === 'all' || prop.category === activeCategory;
        const matchesSearch = prop.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              prop.location.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesPrice = prop.price <= priceRange;
        return matchesCategory && matchesSearch && matchesPrice;
      });

      // Calculate Mortgage
      const loanAmount = calcPrice * (1 - calcDownPayment / 100);
      const monthlyInterestRate = (calcInterest / 100) / 12;
      const totalPayments = calcTerm * 12;
      const monthlyPayment = (loanAmount * (monthlyInterestRate * Math.pow(1 + monthlyInterestRate, totalPayments))) / 
                             (Math.pow(1 + monthlyInterestRate, totalPayments) - 1);
      const formattedMonthlyPayment = isNaN(monthlyPayment) ? '$0' : '$' + Math.round(monthlyPayment).toLocaleString();

      return (
        <div className="relative min-h-screen selection:bg-amber-500 selection:text-slate-950">
          
          {/* Toast Notification */}
          <AnimatePresence>
            {showToast && (
              <motion.div 
                initial={{ opacity: 0, y: 50, scale: 0.9 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                exit={{ opacity: 0, y: 20, scale: 0.95 }}
                className="fixed bottom-8 right-8 z-[2000] glass-panel px-6 py-4 border border-amber-500/40 flex items-center gap-3 text-slate-100 shadow-2xl"
              >
                <div className="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
                  ✓
                </div>
                <div>
                  <p className="font-semibold text-sm">{toastMessage}</p>
                </div>
              </motion.div>
            )}
          </AnimatePresence>

          {/* GLASSMOGRAPHIC NAVBAR */}
          <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${isScrolled ? 'glass-nav py-3' : 'py-6 bg-transparent'}`}>
            <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
              
              {/* Brand Logo */}
              <a href="#" className="flex items-center gap-3 group">
                <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-500 via-amber-300 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
                  <span className="font-serif font-black text-slate-950 text-sm tracking-tighter">KA</span>
                </div>
                <div className="flex flex-col">
                  <span className="font-serif text-lg font-extrabold tracking-widest text-gold-gradient leading-tight">KHANS ARSALAN</span>
                  <span className="text-[9px] tracking-[0.25em] text-slate-400 font-semibold uppercase -mt-0.5">Real Estate Agency</span>
                </div>
              </a>

              {/* Desktop Nav Links */}
              <nav className="hidden md:flex items-center gap-8 glass-pill px-8 py-2.5">
                <a href="#portfolio" className="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors">Portfolio</a>
                <a href="#buttons-showcase" className="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors">UI Buttons</a>
                <a href="#calculator" className="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors">Calculator</a>
                <a href="#experience" className="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors">Experience</a>
                <a href="#contact" className="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors">Private Vault</a>
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-4">
                <a href="#portfolio" className="hidden sm:flex items-center gap-2 text-xs font-semibold text-amber-400 hover:text-amber-300 transition-colors">
                  <span>Saved ({bookmarkedIds.length})</span>
                </a>
                <button 
                  onClick={() => triggerToast('Private Consultation Booking requested with Khans Arsalan!')}
                  className="btn-shimmer-gold text-xs"
                >
                  Schedule Tour
                </button>
              </div>

            </div>
          </header>

          {/* HERO SECTION */}
          <section className="relative min-h-screen flex items-center justify-center pt-28 pb-16 px-6 overflow-hidden">
            {/* Background Parallax Image Overlay */}
            <div className="absolute inset-0 z-0">
              <img 
                src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=85" 
                alt="Luxury Estate Background" 
                className="w-full h-full object-cover opacity-35 scale-105 filter brightness-75"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0B0F19] via-[#0B0F19]/60 to-transparent"></div>
              <div className="absolute inset-0 bg-gradient-to-r from-[#0B0F19] via-transparent to-[#0B0F19]"></div>
            </div>

            <div className="relative z-10 max-w-5xl mx-auto text-center flex flex-col items-center">
              
              {/* Badge Pill */}
              <motion.div 
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
                className="inline-flex items-center gap-2 px-5 py-2 rounded-full glass-pill border border-amber-500/30 text-amber-300 text-xs font-bold tracking-wider uppercase mb-6"
              >
                <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                KHANS ARSALAN LUXURY ESTATE PORTFOLIO 2026
              </motion.div>

              {/* Main Headline */}
              <motion.h1 
                initial={{ opacity: 0, y: 30 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 0.2 }}
                className="font-serif text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-slate-100 leading-[1.1] mb-6"
              >
                Khans Arsalan Real Estate. <br />
                <span className="text-gold-gradient font-italic italic">Architectural Prestige.</span>
              </motion.h1>

              {/* Subheading */}
              <motion.p 
                initial={{ opacity: 0, y: 30 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 0.4 }}
                className="text-slate-300 text-lg sm:text-xl max-w-2xl font-light mb-10 leading-relaxed"
              >
                Curating the world's most trophy-worthy penthouses, oceanfront havens, and private estates under the personal advisory of Khans Arsalan.
              </motion.p>

              {/* Dynamic Glassmorphic Search Bar */}
              <motion.div 
                initial={{ opacity: 0, y: 40 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 0.6 }}
                className="w-full max-w-3xl glass-panel p-4 md:p-6 mb-12 shadow-2xl border border-white/10"
              >
                {/* Search Tabs */}
                <div className="flex gap-2 mb-4 border-b border-white/10 pb-3">
                  {['buy', 'rent', 'commercial', 'luxury'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setActiveHeroTab(tab)}
                      className={`tab-pill-btn uppercase text-xs tracking-wider ${activeHeroTab === tab ? 'active' : ''}`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                {/* Search Inputs Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-left">
                  {/* Location Input */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-white/10">
                    <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Desired Location</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Malibu, Tribeca, Monaco" 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="bg-transparent w-full text-slate-100 text-sm font-semibold focus:outline-none placeholder-slate-500"
                    />
                  </div>

                  {/* Price Slider */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-white/10">
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400">Max Budget</label>
                      <span className="text-xs font-bold text-amber-400">${(priceRange / 1000000).toFixed(0)}M+</span>
                    </div>
                    <input 
                      type="range" 
                      min="10000000" 
                      max="60000000" 
                      step="2000000"
                      value={priceRange}
                      onChange={(e) => setPriceRange(Number(e.target.value))}
                      className="calc-slider mt-2"
                    />
                  </div>

                  {/* Search Action Button */}
                  <button 
                    onClick={() => {
                      document.getElementById('portfolio').scrollIntoView({ behavior: 'smooth' });
                    }}
                    className="btn-shimmer-gold w-full h-full flex items-center justify-center gap-2 rounded-xl text-sm"
                  >
                    <span>Explore Estates</span>
                  </button>
                </div>
              </motion.div>

              {/* Animated Stats Banner */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6 w-full max-w-4xl pt-6 border-t border-white/10 text-center">
                <div>
                  <div className="font-serif text-3xl md:text-4xl font-extrabold text-gold-gradient">$4.2B+</div>
                  <div className="text-xs text-slate-400 uppercase tracking-widest mt-1">Transaction Volume</div>
                </div>
                <div>
                  <div className="font-serif text-3xl md:text-4xl font-extrabold text-slate-100">450+</div>
                  <div className="text-xs text-slate-400 uppercase tracking-widest mt-1">Exclusive Estates</div>
                </div>
                <div>
                  <div className="font-serif text-3xl md:text-4xl font-extrabold text-emerald-gradient">99.4%</div>
                  <div className="text-xs text-slate-400 uppercase tracking-widest mt-1">Client Satisfaction</div>
                </div>
                <div>
                  <div className="font-serif text-3xl md:text-4xl font-extrabold text-slate-100">14</div>
                  <div className="text-xs text-slate-400 uppercase tracking-widest mt-1">Global Offices</div>
                </div>
              </div>

            </div>
          </section>

          {/* AMAZING UI BUTTONS SHOWCASE SECTION */}
          <section id="buttons-showcase" className="py-20 px-6 relative bg-slate-950/60 border-y border-white/5">
            <div className="max-w-7xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-14">
                <span className="text-xs font-bold uppercase tracking-[0.25em] text-amber-400 block mb-2">Design Intelligence</span>
                <h2 className="font-serif text-3xl sm:text-5xl font-bold text-slate-100 mb-4">Amazing UI Buttons & Physics</h2>
                <p className="text-slate-400 text-sm sm:text-base">
                  Interactive demonstration of custom dynamic buttons built according to UI/UX Pro Max rules with micro-animations and spring hover physics.
                </p>
              </div>

              {/* Button Grid Showcase */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                
                {/* Button Card 1 */}
                <div className="glass-panel p-8 flex flex-col items-center text-center justify-between hover:border-amber-500/40 transition-colors">
                  <div className="mb-6">
                    <span className="text-xs font-mono text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">01. Shimmer Gold</span>
                    <h3 className="font-serif text-xl font-semibold text-slate-200 mt-3 mb-2">Liquid Gold Sheen</h3>
                    <p className="text-xs text-slate-400">Sweeping light reflective gradient sheen with high-converting CTA emphasis.</p>
                  </div>
                  <button onClick={() => triggerToast('Shimmer Gold Button Triggered!')} className="btn-shimmer-gold w-full">
                    Liquid Gold CTA
                  </button>
                </div>

                {/* Button Card 2 */}
                <div className="glass-panel p-8 flex flex-col items-center text-center justify-between hover:border-emerald-500/40 transition-colors">
                  <div className="mb-6">
                    <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">02. Emerald Glow</span>
                    <h3 className="font-serif text-xl font-semibold text-slate-200 mt-3 mb-2">Ambient Neon Glow</h3>
                    <p className="text-xs text-slate-400">Translucent backdrop blur container with radiant ambient neon outline glow.</p>
                  </div>
                  <button onClick={() => triggerToast('Emerald Glow Button Triggered!')} className="btn-emerald-glow w-full">
                    Emerald Pulse
                  </button>
                </div>

                {/* Button Card 3 */}
                <div className="glass-panel p-8 flex flex-col items-center text-center justify-between hover:border-cyan-500/40 transition-colors">
                  <div className="mb-6">
                    <span className="text-xs font-mono text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">03. Magnetic Glass</span>
                    <h3 className="font-serif text-xl font-semibold text-slate-200 mt-3 mb-2">Glassmorphic Ripple</h3>
                    <p className="text-xs text-slate-400">Soft spring hover lift effect with frosted crystal glass reflection.</p>
                  </div>
                  <button onClick={() => triggerToast('Magnetic Ripple Triggered!')} className="btn-glass-magnetic w-full">
                    Magnetic Ripple
                  </button>
                </div>

                {/* Button Card 4 */}
                <div className="glass-panel p-8 flex flex-col items-center text-center justify-between hover:border-slate-400/40 transition-colors">
                  <div className="mb-6">
                    <span className="text-xs font-mono text-slate-300 bg-slate-100/10 px-3 py-1 rounded-full border border-slate-100/20">04. Tactile 3D Push</span>
                    <h3 className="font-serif text-xl font-semibold text-slate-200 mt-3 mb-2">Haptic 3D Elevation</h3>
                    <p className="text-xs text-slate-400">Physical depth drop-shadow with tactile click depression physics.</p>
                  </div>
                  <button onClick={() => triggerToast('3D Push Button Triggered!')} className="btn-3d-push w-full">
                    Press Haptic
                  </button>
                </div>

              </div>
            </div>
          </section>

          {/* INTERACTIVE PROPERTY PORTFOLIO GRID */}
          <section id="portfolio" className="py-24 px-6 relative">
            <div className="max-w-7xl mx-auto">
              
              <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                <div>
                  <span className="text-xs font-bold uppercase tracking-[0.25em] text-amber-400 block mb-2">Trophy Real Estate</span>
                  <h2 className="font-serif text-3xl sm:text-5xl font-bold text-slate-100">Khans Arsalan Portfolio</h2>
                </div>

                {/* Category Filter Tabs */}
                <div className="glass-panel p-1.5 flex flex-wrap gap-1">
                  {[
                    { id: 'all', label: 'All Portfolio' },
                    { id: 'penthouse', label: 'Penthouses' },
                    { id: 'villa', label: 'Modern Villas' },
                    { id: 'waterfront', label: 'Waterfront' },
                    { id: 'architectural', label: 'Architectural' }
                  ].map((cat) => (
                    <button
                      key={cat.id}
                      onClick={() => setActiveCategory(cat.id)}
                      className={`tab-pill-btn text-xs ${activeCategory === cat.id ? 'active' : ''}`}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Property Grid Container */}
              {filteredProperties.length === 0 ? (
                <div className="text-center py-20 glass-panel">
                  <p className="text-slate-400 font-serif text-xl">No properties match your current search query or price budget.</p>
                  <button 
                    onClick={() => { setSearchQuery(''); setPriceRange(60000000); setActiveCategory('all'); }} 
                    className="btn-shimmer-gold mt-6 text-xs"
                  >
                    Reset Search Filters
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  <AnimatePresence>
                    {filteredProperties.map((prop) => {
                      const isSaved = bookmarkedIds.includes(prop.id);
                      return (
                        <motion.div
                          key={prop.id}
                          layout
                          initial={{ opacity: 0, scale: 0.9, y: 20 }}
                          animate={{ opacity: 1, scale: 1, y: 0 }}
                          exit={{ opacity: 0, scale: 0.9, y: 20 }}
                          transition={{ duration: 0.4 }}
                          className="property-card group cursor-pointer"
                          onClick={() => setSelectedProperty(prop)}
                        >
                          {/* Image & Badges */}
                          <div className="property-img-wrapper">
                            <img src={prop.image} alt={prop.title} loading="lazy" />
                            <span className={`property-badge ${prop.badgeType === 'gold' ? 'badge-gold' : 'badge-emerald'}`}>
                              {prop.badge}
                            </span>
                            <button 
                              onClick={(e) => toggleBookmark(prop.id, e)}
                              className={`bookmark-btn ${isSaved ? 'active' : ''}`}
                              title={isSaved ? "Saved" : "Save Property"}
                            >
                              ♥
                            </button>
                            <div className="absolute inset-0 bg-gradient-to-t from-[#0B0F19] via-transparent to-transparent opacity-80"></div>
                            
                            {/* Price Tag Overlay */}
                            <div className="absolute bottom-4 left-6 right-6 flex items-center justify-between">
                              <span className="font-serif text-2xl font-black text-amber-300 drop-shadow-md">
                                {prop.priceFormatted}
                              </span>
                            </div>
                          </div>

                          {/* Card Content */}
                          <div className="p-6 flex flex-col flex-1 justify-between">
                            <div>
                              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1 mb-1">
                                📍 {prop.location}
                              </span>
                              <h3 className="font-serif text-xl font-bold text-slate-100 group-hover:text-amber-400 transition-colors line-clamp-1">
                                {prop.title}
                              </h3>
                              <p className="text-slate-400 text-xs mt-2 line-clamp-2 leading-relaxed">
                                {prop.description}
                              </p>
                            </div>

                            {/* Specs Bar */}
                            <div className="pt-6 mt-6 border-t border-white/10 flex items-center justify-between text-xs font-semibold text-slate-300">
                              <span className="flex items-center gap-1">🛏️ {prop.beds} Beds</span>
                              <span className="flex items-center gap-1">🛁 {prop.baths} Baths</span>
                              <span className="flex items-center gap-1">📐 {prop.sqft} sqft</span>
                            </div>
                          </div>
                        </motion.div>
                      );
                    })}
                  </AnimatePresence>
                </div>
              )}

            </div>
          </section>

          {/* REAL-TIME MORTGAGE CALCULATOR SECTION */}
          <section id="calculator" className="py-20 px-6 relative bg-slate-950/80 border-t border-white/5">
            <div className="max-w-5xl mx-auto">
              
              <div className="text-center max-w-xl mx-auto mb-12">
                <span className="text-xs font-bold uppercase tracking-[0.25em] text-emerald-400 block mb-2">Financial Intelligence</span>
                <h2 className="font-serif text-3xl sm:text-4xl font-bold text-slate-100">Interactive Mortgage Calculator</h2>
                <p className="text-slate-400 text-sm mt-2">Estimate monthly debt servicing for high-net-worth property acquisitions.</p>
              </div>

              <div className="glass-panel p-8 md:p-12 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
                
                {/* Left Sliders */}
                <div className="lg:col-span-7 space-y-6">
                  {/* Property Value Slider */}
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-300">Property Price</label>
                      <span className="text-base font-serif font-bold text-amber-400">${(calcPrice / 1000000).toFixed(1)}M</span>
                    </div>
                    <input 
                      type="range" 
                      min="5000000" 
                      max="60000000" 
                      step="1000000" 
                      value={calcPrice}
                      onChange={(e) => setCalcPrice(Number(e.target.value))}
                      className="calc-slider"
                    />
                  </div>

                  {/* Down Payment Slider */}
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-300">Down Payment ({calcDownPayment}%)</label>
                      <span className="text-base font-serif font-bold text-emerald-400">${((calcPrice * calcDownPayment) / 100 / 1000000).toFixed(2)}M</span>
                    </div>
                    <input 
                      type="range" 
                      min="10" 
                      max="50" 
                      step="5" 
                      value={calcDownPayment}
                      onChange={(e) => setCalcDownPayment(Number(e.target.value))}
                      className="calc-slider"
                    />
                  </div>

                  {/* Interest & Term */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold uppercase tracking-wider text-slate-300">Interest Rate</label>
                        <span className="text-sm font-bold text-slate-200">{calcInterest}%</span>
                      </div>
                      <input 
                        type="range" 
                        min="3.5" 
                        max="10.0" 
                        step="0.25" 
                        value={calcInterest}
                        onChange={(e) => setCalcInterest(Number(e.target.value))}
                        className="calc-slider"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold uppercase tracking-wider text-slate-300">Loan Tenure</label>
                        <span className="text-sm font-bold text-slate-200">{calcTerm} Years</span>
                      </div>
                      <input 
                        type="range" 
                        min="10" 
                        max="30" 
                        step="5" 
                        value={calcTerm}
                        onChange={(e) => setCalcTerm(Number(e.target.value))}
                        className="calc-slider"
                      />
                    </div>
                  </div>
                </div>

                {/* Right Result Card */}
                <div className="lg:col-span-5 bg-gradient-to-br from-slate-900 to-[#0F172A] p-8 rounded-2xl border border-amber-500/30 text-center flex flex-col justify-between shadow-2xl">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Estimated Monthly Payment</span>
                    <div className="font-serif text-4xl sm:text-5xl font-black text-gold-gradient mb-6">
                      {formattedMonthlyPayment}
                      <span className="text-xs font-sans text-slate-400 font-normal"> /mo</span>
                    </div>
                  </div>

                  <div className="space-y-3 text-xs text-left bg-black/30 p-4 rounded-xl border border-white/5 mb-6">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Total Loan Amount:</span>
                      <span className="font-bold text-slate-200">${(loanAmount / 1000000).toFixed(2)}M</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Est. Property Taxes /mo:</span>
                      <span className="font-bold text-slate-200">${Math.round(calcPrice * 0.001).toLocaleString()}</span>
                    </div>
                  </div>

                  <button 
                    onClick={() => triggerToast('Pre-Approval Financing Inquiry sent to Khans Arsalan Private Wealth team!')}
                    className="btn-emerald-glow w-full text-xs"
                  >
                    Request Wealth Financing
                  </button>
                </div>

              </div>
            </div>
          </section>

          {/* AGENCY EXPERIENCE SECTION */}
          <section id="experience" className="py-24 px-6 relative">
            <div className="max-w-7xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-16">
                <span className="text-xs font-bold uppercase tracking-[0.25em] text-amber-400 block mb-2">The Khans Arsalan Advantage</span>
                <h2 className="font-serif text-3xl sm:text-5xl font-bold text-slate-100">Bespoke Concierge Excellence</h2>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div className="glass-panel p-8 hover:border-amber-500/40 transition-colors">
                  <div className="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl font-serif mb-6">
                    💎
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-slate-100 mb-3">Off-Market Vault</h3>
                  <p className="text-slate-400 text-sm leading-relaxed">
                    Gain confidential access to private estates, celebrity properties, and trophy penthouses before they reach the public market.
                  </p>
                </div>

                <div className="glass-panel p-8 hover:border-emerald-500/40 transition-colors">
                  <div className="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl font-serif mb-6">
                    🕶️
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-slate-100 mb-3">Virtual Reality Tours</h3>
                  <p className="text-slate-400 text-sm leading-relaxed">
                    Experience ultra-high-definition 8K 360° virtual walkthroughs guided remotely by your dedicated advisor Khans Arsalan.
                  </p>
                </div>

                <div className="glass-panel p-8 hover:border-cyan-500/40 transition-colors">
                  <div className="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl font-serif mb-6">
                    🏛️
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-slate-100 mb-3">Private Wealth Structuring</h3>
                  <p className="text-slate-400 text-sm leading-relaxed">
                    Comprehensive legal, tax, and trust structuring for international buyers acquiring high-value real estate assets.
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* CONTACT & PRIVATE INQUIRY FORM */}
          <section id="contact" className="py-24 px-6 relative bg-slate-950/80 border-t border-white/5">
            <div className="max-w-4xl mx-auto glass-panel p-8 sm:p-14 border border-amber-500/30 shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 right-0 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>

              <div className="text-center max-w-xl mx-auto mb-10">
                <span className="text-xs font-bold uppercase tracking-[0.25em] text-amber-400 block mb-2">Confidential Advisory</span>
                <h2 className="font-serif text-3xl sm:text-4xl font-bold text-slate-100">Consult With Khans Arsalan</h2>
                <p className="text-slate-400 text-sm mt-2">Connect directly with Khans Arsalan & managing partners for bespoke acquisitions.</p>
              </div>

              <form 
                onSubmit={(e) => {
                  e.preventDefault();
                  triggerToast('Thank you. Khans Arsalan private office will contact you within 2 hours.');
                }}
                className="space-y-6"
              >
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-300 block mb-2">Full Name</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="Lord / Lady / Mr. / Ms."
                      className="w-full bg-slate-900/90 border border-white/10 rounded-xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition-colors"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-300 block mb-2">Private Email / Phone</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="client@privateoffice.com"
                      className="w-full bg-slate-900/90 border border-white/10 rounded-xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition-colors"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-300 block mb-2">Acquisition Requirements</label>
                  <textarea 
                    rows="4" 
                    placeholder="Specify desired region, timeline, or special requirements (e.g. Helipad, Yacht berth)..."
                    className="w-full bg-slate-900/90 border border-white/10 rounded-xl px-4 py-3.5 text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition-colors resize-none"
                  ></textarea>
                </div>

                <button type="submit" className="btn-shimmer-gold w-full py-4 text-sm tracking-wider">
                  Request Private Callback from Khans Arsalan
                </button>
              </form>
            </div>
          </section>

          {/* LIGHTBOX PROPERTY DETAIL MODAL */}
          <AnimatePresence>
            {selectedProperty && (
              <div className="modal-overlay" onClick={() => setSelectedProperty(null)}>
                <motion.div 
                  initial={{ opacity: 0, scale: 0.95, y: 30 }}
                  animate={{ opacity: 1, scale: 1, y: 0 }}
                  exit={{ opacity: 0, scale: 0.95, y: 30 }}
                  transition={{ type: "spring", stiffness: 300, damping: 25 }}
                  className="modal-content" 
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Close Button */}
                  <button 
                    onClick={() => setSelectedProperty(null)}
                    className="absolute top-4 right-4 w-10 h-10 rounded-full bg-black/60 text-white flex items-center justify-center z-50 hover:bg-amber-500 transition-colors"
                  >
                    ✕
                  </button>

                  {/* Modal Hero Image */}
                  <div className="relative h-96 w-full overflow-hidden">
                    <img src={selectedProperty.image} alt={selectedProperty.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0F172A] via-transparent to-transparent"></div>
                    <div className="absolute bottom-6 left-8 right-8">
                      <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/20 px-3 py-1 rounded-full border border-amber-500/40">
                        {selectedProperty.badge}
                      </span>
                      <h2 className="font-serif text-3xl sm:text-4xl font-extrabold text-slate-100 mt-2">{selectedProperty.title}</h2>
                      <p className="text-slate-300 text-sm">📍 {selectedProperty.location}</p>
                    </div>
                  </div>

                  {/* Modal Body */}
                  <div className="p-8 space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-white/10">
                      <div>
                        <span className="text-xs text-slate-400 block uppercase font-bold tracking-wider">Offered At</span>
                        <span className="font-serif text-3xl font-black text-gold-gradient">{selectedProperty.priceFormatted}</span>
                      </div>
                      <div className="flex gap-6 text-sm font-semibold text-slate-200">
                        <div>🛏️ {selectedProperty.beds} Bedrooms</div>
                        <div>🛁 {selectedProperty.baths} Bathrooms</div>
                        <div>📐 {selectedProperty.sqft} sqft</div>
                        <div>🚗 {selectedProperty.garage}</div>
                      </div>
                    </div>

                    <div>
                      <h4 className="font-serif text-lg font-bold text-slate-100 mb-2">Property Overview</h4>
                      <p className="text-slate-300 text-sm leading-relaxed">{selectedProperty.description}</p>
                    </div>

                    <div>
                      <h4 className="font-serif text-lg font-bold text-slate-100 mb-3">Key Exclusive Features</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {selectedProperty.features.map((feat, idx) => (
                          <div key={idx} className="flex items-center gap-2 text-xs font-semibold text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-white/5">
                            <span className="text-amber-400">✦</span>
                            <span>{feat}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Action Footer */}
                    <div className="pt-4 flex flex-col sm:flex-row gap-4">
                      <button 
                        onClick={() => {
                          setSelectedProperty(null);
                          triggerToast('360° Virtual Reality Tour stream initiated!');
                        }}
                        className="btn-shimmer-gold flex-1 text-xs"
                      >
                        Launch 360° VR Tour
                      </button>
                      <button 
                        onClick={() => {
                          setSelectedProperty(null);
                          triggerToast('Exclusive Private Showing requested with Khans Arsalan!');
                        }}
                        className="btn-emerald-glow flex-1 text-xs"
                      >
                        Schedule Private Viewing
                      </button>
                    </div>
                  </div>

                </motion.div>
              </div>
            )}
          </AnimatePresence>

          {/* FOOTER */}
          <footer className="py-12 px-6 border-t border-white/10 bg-slate-950 text-slate-400 text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold font-serif text-xs">KA</div>
                <span className="font-serif font-bold text-slate-200">KHANS ARSALAN LUXURY ESTATES</span>
              </div>
              <p>© 2026 Khans Arsalan Real Estate Agency. Designed with UI/UX Pro Max Intelligence.</p>
              <div className="flex gap-6">
                <a href="#" className="hover:text-amber-400 transition-colors">Terms & Privacy</a>
                <a href="#" className="hover:text-amber-400 transition-colors">Private Vault</a>
                <a href="#" className="hover:text-amber-400 transition-colors">Global Partners</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
